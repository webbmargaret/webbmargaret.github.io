  bio         : "I use systems, identity, motivation, and learning theory to understand how institutional structures impact faculty and student development in STEM graduate education. My research explores the intersections of these frameworks to develop insights that can drive meaningful, transformative change in innovative STEM education ecosystems. I'm particularly interested in how things like disciplinary cultures, funding mechanisms, and institutional policies create opportunities or barriers for interdisciplinary collaboration in STEM. I am currently working as a Postdoctoral Associate at Cornell University's InterDisciplinary Education Research (CIDER) program, I leverage my PhD in Engineering Education from Virginia Tech, MS in Civil Engineering, and BS in Mechanical Engineering from Rice University to investigate complex and chaotic educational ecosystems through mixed methods approaches. My work spans interdisciplinary education, participatory action research, and analytical innovation to address pressing challenges in STEM education. My passion for this work began growing up in New Orleans, where experiencing hurricanes firsthand showed me these were chaotic, emergent problems engineers couldn't solve alone. This perspective deepened through my industry experience at ExxonMobil and teaching in diverse educational contexts, reinforcing my commitment to transforming how we prepare engineers to address global societal challenges through interdisciplinary collaboration and adaptive capacity development."
